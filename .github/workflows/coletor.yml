name: Coletor de Brindes (OCR)

# Roda na nuvem do GitHub, sem depender de nenhum computador seu.
# GitHub usa horário UTC; o Brasil é UTC-3, então os horários abaixo estão +3h.
# Janela desejada: todos os dias, das 08:30 às 23:40 (horário de Brasília), a cada 10 minutos.
on:
  schedule:
    - cron: '30,40,50 11 * * *'      # 08:30–08:50 (Brasília)
    - cron: '*/10 12-23 * * *'       # 09:00–20:50 (Brasília)
    - cron: '*/10 0-1 * * *'         # 21:00–22:50 (Brasília)
    - cron: '0,10,20,30,40 2 * * *'  # 23:00–23:40 (Brasília)
  workflow_dispatch: {}              # permite rodar na hora pelo botão "Run workflow"

jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Instalar o navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Ler os monitores e enviar ao portal
        run: node coletor.mjs --uma-vez
        env:
          BRINDES_OCR_TOKEN: ${{ secrets.BRINDES_OCR_TOKEN }}
          # Opcional: descomente para trocar o endereço do portal sem mexer no config.json
          # BRINDES_PORTAL: https://optimall.app
